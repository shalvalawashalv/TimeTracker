services:
  db:
    image: postgres:17
    env_file:
    - .env.compose
    volumes:
    - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 3s
      retries: 10
  app1:
    image: backend:test
    env_file:
    - .env.compose
    depends_on:
      db:
        condition: service_healthy

  app2:
    image: backend:test
    env_file:
    - .env.compose
    depends_on:
      db:
        condition: service_healthy
  
  nginx:
    image: nginx:alpine
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2


volumes:
  postgres_data:
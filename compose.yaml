services:
  db:
    image: postgres:17
    env_file:
    - .env.compose
    volumes:
    - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    env_file:
    - .env.compose
    ports:
    - "8080:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: